common.castOn=Legg opp {stitches} masker
common.bindOff=Fell av maskene og fest tråden.
tee.castOnNeedle=\ på rundpinne {needle}
tee.sleeveFinish=\ Strikk det andre ermet på samme måte.
raglan.gauge=Strikkefasthet i glattstrikk etter vask: {stitches} masker og {rows} omganger per 10 cm. Veiledende pinne {needle} mm; tilpass pinnen for å treffe fastheten.
raglan.bodyIncrease=Økningsomgang: øk 1 maske i starten og slutten av både forstykket og bakstykket, på bolens side av markørene (4 nye masker; ermene er uendret). Løft tråden mellom maskene og strikk den vridd; speilvend økningene ved hver ende. Strikk neste omgang rett uten økninger. Gjenta disse to omgangene {repeats} ganger. {counts}
raglan.counts=Nå er det {front} masker på forstykket, {back} på bakstykket og {sleeve} på hvert erme, totalt {total} masker.
raglan.finishing=Sy igjen eventuelle små hull ved underarmene uten å legge til masker. Fest alle tråder. Vask etter garnets anvisning, legg flatt og form til beregnede mål. Kontroller hals, bærestykke, brystvidde og ermelengde underveis.
tee.raglan=1. omgang: Strikk rett til 1 maske før maskemarkør, øk høyre, strikk 2 r, øk venstre. Gjenta økningen for alle 4 maskemarkører (= 8 masker økt).\n2. omgang: Strikk rett.\n\nStrikk disse 2 omgangene totalt {repeats} ganger = {total} masker.
raglan.increases=Økningsomgang: strikk rett og øk 1 maske på hver side av hver av de fire markørene (8 nye masker: 4 på bolen og 2 på hvert erme). Lag økningene speilvendt av tråden mellom maskene, vridd slik at det ikke blir hull. Strikk neste omgang rett uten økninger. Gjenta disse to omgangene {repeats} ganger, til sammen {rows} omganger (ca. {depth} cm). {counts}
raglan.separation=Strikk forstykket, sett første ermes {sleeve} masker på en tråd og legg opp {underarm} nye masker under ermet. Strikk bakstykket og gjør det samme ved andre erme. Bolen har nå {body} masker. Flytt omgangsstart til midt under ett erme.
raglan.body=Strikk rundt i glattstrikk uten økninger eller fellinger ca. {straight} cm fra delingen. Strikk deretter {hem} cm vrangbord, 1 rett, 1 vrang. Lengden fra delingen inkludert kanten er ca. {below} cm; samlet lengde fra oppleggskanten er ca. {length} cm. Fell løst av i rett over rett og vrang over vrang.
raglan.sleeves=Sett ett ermes {held} ventende masker på pinnen. Plukk opp nøyaktig {underarm} masker i underarmsopplegget, totalt {total} masker. Sett omgangsstart midt under ermet. Strikk rundt i glattstrikk uten fellinger {straight} cm målt fra underarmen. Strikk {cuff} cm vrangbord, 1 rett, 1 vrang. Ermelengde inkludert mansjetten: {length} cm fra underarmen. Fell løst av i mønster. Gjenta på det andre ermet.
